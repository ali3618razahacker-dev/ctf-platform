services:
  ctf:
    build: .
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"
      CTF_DB: /data/ctf.sqlite3
    volumes:
      - ctf-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    restart: unless-stopped
volumes:
  ctf-data:
